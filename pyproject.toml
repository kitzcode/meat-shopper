[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meat-shopper"
version = "1.0.0"
description = "Weekly, per-pound-normalized meat and fish deal digest for local grocers."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "certifi>=2024.2.2"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0", "pdf2image>=1.17"]

[project.scripts]
meat-shopper = "meatshopper.build:main"

[tool.setuptools.packages.find]
where = ["src"]
