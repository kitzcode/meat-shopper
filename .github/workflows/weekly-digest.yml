name: Weekly Meat Digest

# Builds the digest on a weekly schedule and publishes it to GitHub Pages.
# Runs entirely on free GitHub-hosted runners. No paid APIs.

on:
  schedule:
    # 12:00 UTC every Saturday (Sat morning US Eastern). Adjust to taste.
    - cron: "0 12 * * 6"
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

# Least-privilege: allow committing the archive back and deploying Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # System OCR tools (free) so pasted flyer images/PDFs in inbox/ can be read.
      # Harmless if you only ever paste text or JSON.
      - name: Install OCR system deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ocr]"

      - name: Run tests
        run: |
          python tests/test_normalize.py
          python tests/test_sites.py
          python tests/test_pipeline.py

      - name: Build digest
        run: meat-shopper --config config/config.yaml --inbox inbox

      # Keep the archive and the published site in the repo so past weeks persist.
      - name: Commit archive and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly digest $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
